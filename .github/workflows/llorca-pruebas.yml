name: Llorca · pruebas automáticas

on:
  push:
    paths: ["llorca_facturas/**", ".github/workflows/llorca-pruebas.yml"]
  pull_request:
    paths: ["llorca_facturas/**", ".github/workflows/llorca-pruebas.yml"]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: llorca_facturas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llorca_facturas/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compilar todo el código
        run: python -m compileall -q core vistas app.py restaurar_copia.py generar_certificado.py
      - name: Pruebas
        run: python -m pytest -q
